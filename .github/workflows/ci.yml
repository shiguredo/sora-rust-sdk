name: CI

on:
  push:
    paths-ignore:
      - "**.md"

env:
  TEST_SIGNALING_URLS: ${{ secrets.TEST_SIGNALING_URLS }}
  TEST_CHANNEL_ID_PREFIX: ${{ secrets.TEST_CHANNEL_ID_PREFIX }}
  TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
  TEST_API_URL: ${{ secrets.TEST_API_URL }}
  OPENH264_VERSION: "2.6.0"

permissions:
  contents: read
  actions: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxfixes-dev libxcursor-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libvulkan-dev \
            libdbus-1-dev libudev-dev libdrm-dev libgbm-dev \
            libclang-dev

      - run: rustup update stable
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ${{ matrix.os }}
          toolchain: stable

      - uses: shiguredo/github-actions/.github/actions/download-openh264@main
        if: ${{ runner.environment != 'self-hosted' }}
        id: openh264
        with:
          openh264_version: ${{ env.OPENH264_VERSION }}
          use-cache: true
      - name: Set OpenH264 path
        if: ${{ runner.environment != 'self-hosted' && steps.openh264.outputs.openh264_path }}
        run: echo "OPENH264_PATH=${{ steps.openh264.outputs.openh264_path }}" >> $GITHUB_ENV
        shell: bash

      - run: cp .cargo/config.toml.ci .cargo/config.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  ci-self-hosted:
    strategy:
      fail-fast: false
      matrix:
        include:
          - labels: [self-hosted, macOS, ARM64, Apple-M1]
            features: "--features openh264"
          - labels: [self-hosted, linux, x64, NVIDIA-Video-Codec-SDK]
            features: "--features openh264,nvcodec"
          - labels:  [self-hosted, linux, x64, AMD-AMF]
            features: "--features openh264,amf"
          - labels: [self-hosted, linux, x64, Intel-VPL]
            features: "--features openh264,vpl"
    runs-on:
      group: Self
      labels: ${{ matrix.labels }}
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Remove old target
        run: rm -rf target/
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Update PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - run: cp .cargo/config.toml.ci .cargo/config.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace ${{ matrix.features }} -- -D warnings
      - run: cargo test --workspace ${{ matrix.features }} -- --skip test_video_capture_frame_received --skip test_video_capture_session_create

  ci-cross:
    strategy:
      fail-fast: false
      matrix:
        include:
          - labels: [self-hosted, linux, x64]
            target: raspberry-pi-os_armv8
            ssh_host: "shiguredo@raspberrypi"
            rust_target: "aarch64-unknown-linux-gnu"
            features: ""
    runs-on:
      group: Self
      labels: ${{ matrix.labels }}
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Remove old target
        run: rm -rf target/
      - name: Create SSH config
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/config
          cat >> ~/.ssh/config <<'EOF'
          Host *
            ServerAliveInterval 60
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Update PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - run: cp .cargo/config.toml.ci .cargo/config.toml

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # bindgen がクロスコンパイル時に aarch64 用ヘッダーを参照するために gcc-aarch64-linux-gnu が必要
          sudo apt-get install -y \
            debian-archive-keyring \
            gcc-aarch64-linux-gnu
          # cargo-shiguredo-sysroot は独自 apt 設定で sources.list のみ差し替えるため、
          # Debian の keyring を trusted.gpg.d に配置しないと trixie の署名検証に失敗する。
          sudo install -Dm644 /usr/share/keyrings/debian-archive-keyring.gpg \
            /etc/apt/trusted.gpg.d/debian-archive-keyring.gpg

      # クロスコンパイルに必要なツールチェインのインストール
      - run: rustup update stable
      - run: rustup target add ${{ matrix.rust_target }}

      # .env.remote を作成
      - name: Create .env.remote
        run: |
          touch e2e-tests/.env.remote
          ENVS=(
            TEST_SIGNALING_URLS
            TEST_CHANNEL_ID_PREFIX
            TEST_CHANNEL_ID_SUFFIX
          )
          for name in "${ENVS[@]}"; do
            if [[ -v "$name" ]]; then
              printf '%s=%s\n' "$name" "${!name}" >> e2e-tests/.env.remote
            fi
          done

      # sysroot の構築と設定
      - run: cargo install shiguredo_sysroot
      - run: cargo shiguredo-sysroot --config sysroot/${{ matrix.target }}.json

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --target ${{ matrix.rust_target }} ${{ matrix.features }} -- -D warnings
      - name: cargo test
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER="./scripts/runner.sh ${{ matrix.ssh_host }} /tmp/sora-rust-sdk/bin"
          cargo test --workspace --target ${{ matrix.rust_target }} ${{ matrix.features }} -- --skip test_video_capture_frame_received --skip test_video_capture_session_create

  slack_notify:
    needs: [ci, ci-self-hosted, ci-cross]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-rust-sdk
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
