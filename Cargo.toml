[package]
name = "sora_sdk"
version = "2026.1.0-canary.15"
edition = "2024"
rust-version = "1.93"
description = "Sora Rust SDK"
readme = "README.md"
homepage = "https://github.com/shiguredo/sora-rust-sdk"
repository = "https://github.com/shiguredo/sora-rust-sdk"
license = "Apache-2.0"
include = ["/LICENSE", "/README.md", "/src/**"]

[workspace]
members = ["e2e-tests", "examples/sumomo", "pbt"]

[workspace.dependencies]
# SDK 本体
sora_sdk = { path = "." }

# 時雨堂クレート

# AMD AMF (Advanced Media Framework) によるハードウェアエンコード/デコード
shiguredo_amf = "~2026.3"
# HTTP プロキシの CONNECT トンネリングと URI パースで利用
shiguredo_http11 = "~2026.6"
# libcamera 経由のカメラキャプチャ (Linux 向け)
shiguredo_libcamera = "~2026.1"
# MP4 ファイルからの映像入力で利用するデマルチプレクサ
shiguredo_mp4 = "~2026.3"
# NVIDIA Video Codec によるハードウェアエンコード/デコード
shiguredo_nvcodec = "~2026.2"
# OpenH264 による H.264 ソフトウェアエンコード/デコード
shiguredo_openh264 = "~2026.1"
# V4L2 M2M によるハードウェアコーデックと画像変換 (Linux 向け)
shiguredo_v4l2 = "~2026.1"
# Intel VPL によるハードウェアエンコード/デコード
shiguredo_vpl = "~2026.3"
# WebRTC スタック本体 (PeerConnection、メディアエンジン等)
shiguredo_webrtc = "~0.150"
# Sora シグナリングへの接続で利用する WebSocket クライアント実装
shiguredo_websocket = "~2026.3"

# 外部クレート

# rustls の暗号バックエンドおよび WebSocket の SecureRandom 実装に利用
aws-lc-rs = "1.17"
# libcamera のフレームバッファを mmap/munmap するための POSIX FFI
libc = "0.2"
# DataChannel メッセージの zlib 圧縮/解凍に利用
noflate = "0.1"
# シグナリングメッセージ等の JSON パース・生成
nojson = "0.3"
# Property-Based Testing フレームワーク
proptest = "1.11"
# Sora シグナリングへの WSS 接続で利用する TLS 1.2/1.3 実装
rustls = {
  version = "0.23",
  default-features = false,
  features = [
    "aws-lc-rs",
    "std",
    "tls12",
  ]
}
# OS 標準のルート証明書ストアによるサーバー証明書検証
rustls-platform-verifier = "0.7"
# TURN over TLS 用の CA 証明書による独自サーバー証明書検証に利用
rustls-webpki = {
  version = "0.103",
  default-features = false,
  features = [
    "aws-lc-rs",
    "std",
  ]
}
# SDK 全体の非同期処理を支える非同期ランタイム
tokio = "1.53"
# tokio 上で rustls を利用するためのアダプタ
tokio-rustls = {
  version = "0.26",
  default-features = false,
  features = [
    "aws-lc-rs",
  ]
}

[dependencies]
# 時雨堂クレート
shiguredo_amf = { workspace = true, optional = true }
shiguredo_http11.workspace = true
shiguredo_libcamera = { workspace = true, optional = true }
shiguredo_mp4.workspace = true
shiguredo_nvcodec = { workspace = true, optional = true }
shiguredo_openh264 = { workspace = true, optional = true }
shiguredo_v4l2 = { workspace = true, optional = true }
shiguredo_vpl = { workspace = true, optional = true }
shiguredo_webrtc.workspace = true
shiguredo_websocket.workspace = true

# 外部クレート
aws-lc-rs.workspace = true
libc = { workspace = true, optional = true }
noflate.workspace = true
nojson.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
rustls-webpki.workspace = true
tokio = {
  workspace = true,
  features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
  ]
}
tokio-rustls.workspace = true

[features]
default = ["openh264"]
amf = ["dep:shiguredo_amf"]
libcamera = ["dep:libc", "dep:shiguredo_libcamera"]
nvcodec = ["dep:shiguredo_nvcodec"]
openh264 = ["dep:shiguredo_openh264"]
v4l2 = ["dep:shiguredo_v4l2"]
vpl = ["dep:shiguredo_vpl"]
