[package]
name = "sora_sdk"
version = "2026.1.0-canary.1"
edition = "2024"
rust-version = "1.88"
authors = ["Shiguredo Inc."]
license = "Apache-2.0"
description = "Sora Rust SDK"
homepage = "https://github.com/shiguredo/sora-rust-sdk"
repository = "https://github.com/shiguredo/sora-rust-sdk"
readme = "README.md"
include = ["/src/**", "/LICENSE", "/README.md"]

[features]
default = []
nvcodec = ["dep:shiguredo_nvcodec"]

[dependencies]
shiguredo_webrtc = { workspace = true }
shiguredo_http11 = "2026.1.1"
shiguredo_websocket = "2026.1.0-canary.5"
shiguredo_nvcodec = { version = "2025.2.2", optional = true }
nojson = "0.3"
rand = "0.9"
aws-lc-rs = "1"
flate2 = "1"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws-lc-rs",
] }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "aws-lc-rs",
] }
rustls-platform-verifier = "0.6"
rustls-webpki = { version = "0.103", default-features = false, features = [
    "std",
    "aws-lc-rs",
] }

[workspace]
members = ["examples/sumomo", "examples/zakuro", "e2e-tests"]

[workspace.dependencies]
shiguredo_webrtc = { version = "=0.146.1-canary.1" }

[dev-dependencies]
proptest = "1"
