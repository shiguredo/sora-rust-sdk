[package]
name = "sora_sdk"
version = "2026.1.0-canary.6"
edition = "2024"
rust-version = "1.88"
description = "Sora Rust SDK"
readme = "README.md"
homepage = "https://github.com/shiguredo/sora-rust-sdk"
repository = "https://github.com/shiguredo/sora-rust-sdk"
license = "Apache-2.0"
include = ["/LICENSE", "/README.md", "/src/**"]

[workspace]
members = ["e2e-tests", "examples/sumomo"]

[workspace.dependencies]
shiguredo_webrtc = { version = "=0.147.1-canary.5" }

[dependencies]
aws-lc-rs = "1.16"
flate2 = "1.1"
libc = { version = "0.2", optional = true }
nojson = "0.3"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = [
  "aws-lc-rs",
  "std",
  "tls12",
] }
rustls-platform-verifier = "0.6"
rustls-webpki = { version = "0.103", default-features = false, features = [
  "aws-lc-rs",
  "std",
] }
shiguredo_amf = { version = "2026.2", optional = true }
shiguredo_http11 = "2026.1"
shiguredo_libcamera = { version = "2026.1.0-canary.1", optional = true }
shiguredo_mp4 = "2026.3"
shiguredo_nvcodec = { version = "2026.1", optional = true }
shiguredo_openh264 = { version = "2026.1", optional = true }
shiguredo_v4l2 = { version = "2026.1.0-canary.2", optional = true }
shiguredo_vpl = { version = "2026.1", optional = true }
shiguredo_webrtc = { workspace = true }
shiguredo_websocket = "2026.1"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "aws-lc-rs",
] }

[dev-dependencies]
proptest = "1.11"

[features]
default = ["openh264"]
amf = ["dep:shiguredo_amf"]
libcamera = ["dep:libc", "dep:shiguredo_libcamera"]
nvcodec = ["dep:shiguredo_nvcodec"]
openh264 = ["dep:shiguredo_openh264"]
v4l2 = ["dep:shiguredo_v4l2"]
vpl = ["dep:shiguredo_vpl"]
